name: ci
on:
  push:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Record start time
        run: echo "CI_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install -e . --no-deps
      - name: Print versions
        run: |
          python - <<'PY'
          import platform, sys
          import highspy
          from capex.audit.fingerprint import package_versions
          pkgs = package_versions()
          print("python", sys.version.split()[0])
          for name in ("numpy", "scipy", "pandas", "highspy"):
              print(name, pkgs[name])
          print("HiGHS", highspy.Highs().version())
          print("OS", platform.platform())
          PY
      - name: Test
        run: |
          mkdir -p reports-ci
          set -o pipefail
          pytest -v --disable-socket --junitxml=reports-ci/junit.xml 2>&1 | tee reports-ci/pytest.log
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports-ci/junit.xml
            reports-ci/pytest.log
          retention-days: 30
      - name: Report wall time
        if: always()
        run: |
          elapsed=$(( $(date +%s) - CI_START ))
          echo "CI wall time: $((elapsed / 60)) min $((elapsed % 60)) s" >> "$GITHUB_STEP_SUMMARY"
          if [ "$elapsed" -gt 600 ]; then echo "::warning::CI wall time ${elapsed}s exceeds 600s budget"; fi
