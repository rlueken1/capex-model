name: ci
on:
  push:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Record start time
        run: echo "CI_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Install
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install -e . --no-deps
      - name: Print versions
        run: |
          python - <<'PY'
          import platform, sys
          import highspy
          from capex.audit.fingerprint import package_versions
          pkgs = package_versions()
          print("python", sys.version.split()[0])
          for name in ("numpy", "scipy", "pandas", "highspy"):
              print(name, pkgs[name])
          print("HiGHS", highspy.Highs().version())
          print("OS", platform.platform())
          PY
      - name: Parse workflow files
        run: python scripts/check_workflows.py
      - name: Check xfail/skip markers (C5)
        run: |
          python scripts/check_markers.py --self-test || test $? -eq 1
          python scripts/check_markers.py
      - name: Test
        run: |
          mkdir -p reports-ci
          set -o pipefail
          pytest -v --disable-socket --junitxml=reports-ci/junit.xml 2>&1 | tee reports-ci/pytest.log
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            reports-ci/junit.xml
            reports-ci/pytest.log
          retention-days: 30
      - name: Report wall time
        if: always()
        run: |
          elapsed=$(( $(date +%s) - CI_START ))
          echo "CI wall time: $((elapsed / 60)) min $((elapsed % 60)) s" >> "$GITHUB_STEP_SUMMARY"
          if [ "$elapsed" -gt 600 ]; then echo "::warning::CI wall time ${elapsed}s exceeds 600s budget"; fi
  health-run:
    # C6 + C7: T1-T4 through the CLI under two PYTHONHASHSEED values; `compare` checks the two outputs.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        seed: ["0", "12345"]
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Install
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install -e . --no-deps
      - name: Health run (cases T1-T4)
        run: python scripts/ci_health_run.py --out "$RUNNER_TEMP/health-out"
      - name: Upload case outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: health-seed-${{ matrix.seed }}
          path: ${{ runner.temp }}/health-out
          retention-days: 30
  compare:
    needs: health-run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Install
        run: python -m pip install -r requirements-ci.txt
      - uses: actions/download-artifact@v8
        with:
          pattern: health-seed-*
          path: ${{ runner.temp }}/seeds
      - name: Compare fingerprints and canonical outputs across seeds
        run: python scripts/compare_runs.py "$RUNNER_TEMP/seeds/health-seed-0" "$RUNNER_TEMP/seeds/health-seed-12345"
